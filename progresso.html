<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progresso — Offshore Estudy Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/core-tokens.css" />
<link rel="stylesheet" href="assets/css/cockpit-master.css" />
<link rel="stylesheet" href="assets/css/crt-arcade.css" />
<link rel="stylesheet" href="assets/css/print.css" media="print" />
</head>
<body>

<main class="progresso-page">
  <section class="card progresso-page__resumo">
    <div class="progresso-page__perfil">
      <div class="progresso-page__retrato">
        <img id="progresso-retrato" class="progresso-page__retrato-img" alt="Retrato de Rafaela" />
      </div>
      <div class="progresso-page__identidade">
        <h1 class="font-display text-gold progresso-page__title">DOSSIÊ DE PROGRESSO</h1>
        <div class="progresso-page__patente-badge">
          <span class="font-mono text-dim">PATENTE ATUAL</span>
          <span class="font-display text-gold" id="patente-atual">—</span>
        </div>
      </div>
    </div>

    <div class="progresso-page__xp-bloco">
      <div class="progresso-page__xp-linha">
        <span class="font-mono" id="xp-atual">0 XP</span>
        <span class="font-mono text-dim" id="xp-proxima-patente"></span>
      </div>
      <div class="progresso-page__xp-barra" id="xp-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>

    <div class="progresso-page__stats">
      <div class="progresso-page__stat-card">
        <span class="progresso-page__stat-numero" id="stat-modulos">0</span>
        <span class="progresso-page__stat-label">MÓDULOS COM PROGRESSO</span>
      </div>
      <div class="progresso-page__stat-card">
        <span class="progresso-page__stat-numero" id="stat-insignias">0/0</span>
        <span class="progresso-page__stat-label">INSÍGNIAS DESBLOQUEADAS</span>
      </div>
    </div>

    <div class="progresso-page__contador font-mono" id="contador-modulos">
      Nenhum módulo publicado ainda.
    </div>

    <a href="conquistas.html" class="cockpit-master__btn progresso-page__link-conquistas">
      🏆 Ver Galeria de Conquistas
    </a>
  </section>

  <section class="card progresso-page__insignias-preview">
    <h2 class="font-display text-gold progresso-page__subtitle">CONQUISTAS</h2>
    <div class="conquistas-page__grid" id="insignias-preview"></div>
  </section>

  <section class="card progresso-page__modulos" id="lista-modulos-card">
    <h2 class="font-display text-gold progresso-page__subtitle">MÓDULOS COM PROGRESSO</h2>
    <ul class="progresso-page__lista" id="lista-modulos"></ul>
  </section>
</main>

<script src="assets/js/theme-controller.js"></script>
<script src="assets/js/audio-engine.js"></script>
<script src="assets/js/state-store.js"></script>
<script src="assets/js/github-sync-client.js"></script>
<script src="assets/js/progress-engine.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/cockpit-element.js"></script>
<script src="assets/js/sprite-utils.js"></script>
<script>
  const cockpit = SubseaCockpit.init({ activeNav: 'progresso' });

  SubseaSpriteUtils.carregarSpriteRecortado(
    'assets/img/opening/rafaela-sprite.jpg',
    document.getElementById('progresso-retrato'),
  );

  const TOTAL_MODULOS_PUBLICADOS = 0; // placeholder até a trilha-de-aprendizagem existir
  const SEGMENTOS_XP = 20;

  function renderBarraXp(xp, tierAtualMin, proximoTierMin) {
    const barra = document.getElementById('xp-barra');
    let percentual = 1; // patente máxima: barra cheia
    if (proximoTierMin !== null) {
      percentual = (xp - tierAtualMin) / (proximoTierMin - tierAtualMin);
    }
    const preenchidos = Math.round(Math.max(0, Math.min(1, percentual)) * SEGMENTOS_XP);

    barra.setAttribute('aria-valuenow', String(Math.round(percentual * 100)));
    barra.innerHTML = Array.from({ length: SEGMENTOS_XP })
      .map((_, i) => `<span class="progresso-page__xp-segmento ${i < preenchidos ? 'progresso-page__xp-segmento--preenchido' : ''}"></span>`)
      .join('');
  }

  function renderProgresso() {
    const { progresso } = cockpit.store.getState();
    const patente = SubseaProgressEngine.getPatenteAtual(progresso.xp);
    const proxima = SubseaProgressEngine.getProximaPatente(progresso.xp);
    const concluidos = SubseaProgressEngine.contarModulosConcluidos(progresso);
    const insignias = SubseaProgressEngine.listarInsigniasComStatus(progresso);
    const insigniasDesbloqueadas = insignias.filter((i) => i.desbloqueada).length;

    const tierAtual = [...SubseaProgressEngine.PATENTE_TIERS].reverse().find((t) => progresso.xp >= t.min);

    document.getElementById('patente-atual').textContent = patente;
    document.getElementById('xp-atual').textContent = `${progresso.xp} XP`;
    document.getElementById('xp-proxima-patente').textContent = proxima
      ? `(faltam ${proxima.min - progresso.xp} XP para ${proxima.titulo})`
      : '(patente máxima atingida)';
    renderBarraXp(progresso.xp, tierAtual.min, proxima ? proxima.min : null);

    document.getElementById('stat-modulos').textContent = String(concluidos);
    document.getElementById('stat-insignias').textContent = `${insigniasDesbloqueadas}/${insignias.length}`;

    const contadorEl = document.getElementById('contador-modulos');
    if (TOTAL_MODULOS_PUBLICADOS === 0) {
      contadorEl.textContent =
        concluidos === 0
          ? 'Nenhum módulo publicado ainda.'
          : `Nenhum módulo publicado ainda — ${concluidos} módulo(s) de teste concluído(s).`;
    } else {
      contadorEl.textContent = `${concluidos} de ${TOTAL_MODULOS_PUBLICADOS} módulos concluídos.`;
    }

    const previewEl = document.getElementById('insignias-preview');
    previewEl.innerHTML = insignias
      .map(
        (i) => `
        <div class="card insignia ${i.desbloqueada ? '' : 'insignia--bloqueada'}">
          <div class="insignia__icone">${i.desbloqueada ? '🏅' : '🔒'}</div>
          <div class="font-display text-gold insignia__titulo">${i.titulo}</div>
          <div class="text-dim insignia__descricao">${i.descricao}</div>
        </div>`,
      )
      .join('');

    const listaEl = document.getElementById('lista-modulos');
    const moduloIds = Object.keys(progresso.modulos);
    if (moduloIds.length === 0) {
      listaEl.innerHTML = '<li class="text-dim">Nenhum módulo concluído ainda.</li>';
    } else {
      listaEl.innerHTML = moduloIds
        .map((id) => {
          const niveis = progresso.modulos[id].niveisConcluidos.join(', ');
          return `
            <li class="progresso-page__modulo-item">
              <span class="text-gold">${id}</span>
              <span class="progresso-page__modulo-niveis">níveis: ${niveis}</span>
            </li>`;
        })
        .join('');
    }
  }

  renderProgresso();
  cockpit.store.onChange(renderProgresso);
</script>
</body>
</html>
