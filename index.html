<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offshore Estudy Game</title>
<meta name="description" content="Jogo educativo sobre engenharia offshore e submarina — Offshore Estudy Game." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/core-tokens.css" />
<link rel="stylesheet" href="assets/css/cockpit-master.css" />
<link rel="stylesheet" href="assets/css/crt-arcade.css" />
<link rel="stylesheet" href="assets/css/print.css" media="print" />
</head>
<body>

<main class="opening" id="opening-main">
  <div class="opening__scanlines" aria-hidden="true"></div>

  <section class="opening__hero card">
    <p class="font-mono text-dim opening__eyebrow">SISTEMA TÁTICO OFFSHORE</p>
    <h1 class="font-display opening__title text-gold">OFFSHORE<br />ESTUDY GAME</h1>
    <p class="opening__subtitle">
      Engenharia submarina e exploração de petróleo, em uma jornada de estudo no seu ritmo.
    </p>

    <button type="button" id="press-start-btn" class="opening__start-btn font-display">
      ▶ PRESS START ◀
    </button>

    <p class="font-mono text-dim opening__hint">Aperte Espaço ou Enter</p>
  </section>

</main>

<script src="assets/js/theme-controller.js"></script>
<script src="assets/js/audio-engine.js"></script>
<script src="assets/js/state-store.js"></script>
<script src="assets/js/github-sync-client.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/cockpit-element.js"></script>
<script>
  const cockpit = SubseaCockpit.init({ activeNav: 'inicio' });

  function goToTrilha() {
    cockpit.audio.playStartJingle();
    const main = document.getElementById('opening-main');
    main.classList.add('subsea-transition-shake', 'subsea-transition-flash');
    window.setTimeout(() => {
      window.location.href = 'capitulos/index.html';
    }, 280);
  }

  document.getElementById('press-start-btn').addEventListener('click', goToTrilha);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      goToTrilha();
    }
  });
</script>
</body>
</html>
